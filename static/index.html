<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obscure Cinema Vault</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --error-bg: #7f1d1d;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1rem;
    }
    .container {
      max-width: 480px;
      width: 100%;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    header {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    h1 { margin: 0 0 0.5rem 0; font-size: 1.5rem; color: var(--accent); }
    p { margin: 0; color: var(--text-muted); font-size: 0.9rem; }
    
    .poster-container {
      width: 100%;
      height: 320px;
      background-color: #020617;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 1rem;
    }
    .poster-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .movie-details { margin-bottom: 1.5rem; }
    .movie-title { font-size: 1.25rem; margin: 0 0 0.5rem 0; }
    .meta { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.75rem; }
    .overview { font-size: 0.9rem; line-height: 1.4; color: #cbd5e1; max-height: 100px; overflow-y: auto; }
    
    .btn {
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 6px;
      background-color: var(--accent);
      color: #020617;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s ease;
    }
    .btn:hover { background-color: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .error-banner {
      background-color: var(--error-bg);
      color: #fecaca;
      padding: 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-bottom: 1rem;
      display: none;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Obscure Movie Picker</h1>
      <p>Discover underrated gems with under 500 total ratings.</p>
    </header>

    <div id="error-box" class="error-banner"></div>

    <div class="poster-container">
      <img id="poster" src="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><path d='M21 15l-5-5L5 21'/></svg>" alt="Movie Poster Placeholder" />
    </div>

    <div class="movie-details">
      <h2 id="title" class="movie-title">Ready when you are</h2>
      <div id="meta" class="meta">Click below to unearth a title.</div>
      <p id="overview" class="overview"></p>
    </div>

    <button id="pick-btn" class="btn" onclick="fetchObscureMovie()">Unearth Obscure Movie</button>
  </div>

  <script>
    async function fetchObscureMovie() {
      const btn = document.getElementById('pick-btn');
      const errorBox = document.getElementById('error-box');
      const titleEl = document.getElementById('title');
      const metaEl = document.getElementById('meta');
      const overviewEl = document.getElementById('overview');
      const posterEl = document.getElementById('poster');

      // State: Loading
      btn.disabled = true;
      btn.innerText = "Searching the vault...";
      errorBox.style.display = "none";

      try {
        const response = await fetch('/api/pick-movie');
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Failed to fetch movie.');
        }

        // Render Data
        titleEl.innerText = data.title;
        metaEl.innerText = `Released: ${data.release_date} | Rating: ★ ${data.rating} (${data.vote_count} votes)`;
        overviewEl.innerText = data.overview;

        // Fallback image handling
        if (data.poster_url) {
          posterEl.src = data.poster_url;
        } else {
          posterEl.src = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='100' height='100' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2'><rect x='3' y='3' width='18' height='18' rx='2'/><path d='M21 15l-5-5L5 21'/></svg>";
        }

      } catch (err) {
        errorBox.innerText = err.message;
        errorBox.style.display = "block";
      } finally {
        // State: Reset Button
        btn.disabled = false;
        btn.innerText = "Unearth Another Movie";
      }
    }
  </script>
</body>
</html>
